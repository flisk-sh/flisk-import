<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" role="img" aria-labelledby="t d">
<title id="t">A Procfile converted by flisk-import, then flisk project and flisk up</title>
<desc id="d">Animation. Three Procfile lines become three service.json files; flisk project writes .tdk; flisk up writes the .autogenerated folders; the build then stops because there is no image or Dockerfile.</desc>
<style>@keyframes k0{0%,0.00%{opacity:0}0.80%,94%{opacity:1}100%{opacity:0}}@keyframes k1{0%,12.50%{opacity:0}13.30%,94%{opacity:1}100%{opacity:0}}@keyframes k2{0%,33.33%{opacity:0}34.13%,94%{opacity:1}100%{opacity:0}}@keyframes k3{0%,54.17%{opacity:0}54.97%,94%{opacity:1}100%{opacity:0}}@keyframes k4{0%,77.08%{opacity:0}77.88%,94%{opacity:1}100%{opacity:0}}.s0{opacity:0;animation:k0 24.0s infinite}.s1{opacity:0;animation:k1 24.0s infinite}.s2{opacity:0;animation:k2 24.0s infinite}.s3{opacity:0;animation:k3 24.0s infinite}.s4{opacity:0;animation:k4 24.0s infinite}@media (prefers-reduced-motion:reduce){.s0{animation:none;opacity:1}.s1{animation:none;opacity:1}.s2{animation:none;opacity:1}.s3{animation:none;opacity:1}.s4{animation:none;opacity:1}} text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#e2e8f0} .h{font-size:15px;font-weight:700} .dim{fill:#94a3b8} .cmd{fill:#7dd3fc} .new{fill:#86efac} .auto{fill:#fbbf24} .bad{fill:#fca5a5}</style>
<rect width="1080" height="560" rx="14" fill="#0f172a"/>
<text class="h" x="28" y="36">Procfile → Flisk, with every file it produces</text>
<text class="dim" x="28" y="76">Procfile</text>
<g class="s0"><text x="28" y="98">web: node server.js</text><text x="28" y="116">worker: node worker.js</text><text x="28" y="134">release: npm run migrate</text></g>
<g class="s1"><text class="cmd" x="28" y="190">$ flisk-import . --yes</text><text class="dim" x="28" y="208">3 service.json written</text><text class="dim" x="28" y="226">release → job (restart: no)</text></g>
<g class="s2"><text class="cmd" x="28" y="274">$ flisk project --yes</text><text class="dim" x="28" y="292">$ flisk config regenerate</text><text class="dim" x="28" y="310">project + Tilt files written</text></g>
<g class="s3"><text class="cmd" x="28" y="358">$ flisk up proc</text><text class="dim" x="28" y="376">generates .autogenerated/</text><text class="dim" x="28" y="394">(amber files on the right)</text></g>
<g class="s4"><rect x="20" y="440" width="410" height="100" rx="8" fill="#14301f"/>
<text class="new" x="34" y="464">Observed: web and api both build and run,</text>
<text class="new" x="34" y="484">and answer HTTP on $PORT.</text>
<text class="dim" x="34" y="506">Needs tdk with buildContext (cli-core#525).</text>
<text class="dim" x="34" y="526">Dockerfile is scaffolded for node/bun only.</text></g>
<line x1="450" y1="20" x2="450" y2="540" stroke="#334155"/>
<text class="dim" x="470" y="76">project tree</text>
<text class="s0 " x="470" y="102">  Procfile</text>
<text class="s1 new" x="470" y="124">+ services/proc/web/service.json</text>
<text class="s1 new" x="470" y="146">+ services/proc/worker/service.json</text>
<text class="s1 new" x="470" y="168">+ services/proc/release/service.json</text>
<text class="s2 new" x="470" y="190">+ .tdk/project.json</text>
<text class="s2 new" x="470" y="212">+ .tdk/.tdk-out/Tiltfile</text>
<text class="s2 new" x="470" y="234">+ .tdk/.tdk-out/docker-compose.traefik.yml</text>
<text class="s2 new" x="470" y="256">+ .tdk/.tdk-out/host-ports.json</text>
<text class="s3 auto" x="470" y="278">+ services/proc/.autogenerated/docker-compose.app.autogenerated.yml</text>
<text class="s3 auto" x="470" y="300">+ services/proc/web/.autogenerated/service.yaml</text>
<text class="s3 auto" x="470" y="322">+ services/proc/web/.autogenerated/.env.backend.autogenerated</text>
<text class="s3 auto" x="470" y="344">+ services/proc/web/.autogenerated/.tdk-contract/service.json.source</text>
<text class="s3 auto" x="470" y="366">+ services/proc/{worker,release}/.autogenerated/  (same 4 files)</text>
<text class="s1 new" x="470" y="388">+ services/proc/web/Dockerfile  (scaffolded from `node server.js`)</text>
<g class="s3"><text class="auto" x="470" y="418">+ amber = written by flisk up, do not edit</text></g>
<g class="s3"><text class="new" x="470" y="438">+ green = written by flisk-import / flisk project</text></g>
</svg>