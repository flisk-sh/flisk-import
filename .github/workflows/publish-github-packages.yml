name: Publish tdk-import to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: github-package-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tdk-landscape'

      - name: Install and verify
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm run test

      - name: Check release version and pack package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Release tag version '$tag_version' does not match package version '$package_version'."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/tdk-import-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/tdk-import-package" > "$RUNNER_TEMP/tdk-import-pack.json"
          tarball="$RUNNER_TEMP/tdk-import-package/$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/tdk-import-pack.json', 'utf8'))[0].filename")"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::npm pack did not produce the expected package archive."
            exit 1
          fi

          node --input-type=module - "$RUNNER_TEMP/tdk-import-pack.json" <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0];
          const files = new Set(report.files.map(({ path }) => path));
          for (const required of ['package.json', 'README.md', 'dist/cli.js']) {
            if (!files.has(required)) throw new Error(`Package is missing required file: ${required}`);
          }
          for (const file of files) {
            if (file.startsWith('node_modules/') || file.includes('/node_modules/') || file.startsWith('.git/')) {
              throw new Error(`Package contains excluded content: ${file}`);
            }
          }
          console.log(`Validated ${report.filename} (${report.size} bytes)`);
          NODE

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/github-packages.npmrc"
          printf '@tdk-landscape:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$PACKAGE_TARBALL" --registry=https://npm.pkg.github.com/ || {
            echo "::error::GitHub Packages publication failed for version $PACKAGE_VERSION."
            exit 1
          }

      - name: Retain package archive for release recovery
        if: always() && steps.package.outputs.tarball != ''
        uses: actions/upload-artifact@v4
        with:
          name: tdk-import-package-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30
