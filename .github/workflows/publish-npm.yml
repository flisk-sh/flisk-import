name: Publish flisk-import to npm

# flisk-import is published to npmjs.org from this repository with npm's trusted publishing
# (OIDC): no long-lived npm token lives in this repo, and the publish is attested with
# provenance that names this repository's workflow and source.
#
# The package is published under two names: the unscoped "flisk-import" and the scoped
# "@flisk-sh/flisk-import". A package has exactly one name in its package.json, so the
# second name is the same archive with the name rewritten in the packed manifest.
#
# Owner setup required before the first publish succeeds: npmjs.com -> Packages -> flisk-import
# -> Settings -> Trusted Publisher -> GitHub Actions -> organization "flisk-sh", repository
# "flisk-import", workflow filename "publish-npm.yml", allowed action "npm publish". The same
# configuration is needed for "@flisk-sh/flisk-import" once that package exists.
# A package's first version cannot be published through OIDC, so version 0.2.2 (or later) has
# to be published once with an npm token before the trusted publisher can take over.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14; the pinned CLI also
      # supports managing dist-tags through OIDC.
      - name: Install a trusted-publishing-capable npm CLI
        run: npm install --global npm@12.2.0

      - name: Install and verify
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm run test

      - name: Check release version and pack package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag_version="$(node -p "require('./package.json').version")"; fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Release tag version '$tag_version' does not match package version '$package_version'."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flisk-import-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/flisk-import-package" > "$RUNNER_TEMP/flisk-import-pack.json"
          tarball="$RUNNER_TEMP/flisk-import-package/$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/flisk-import-pack.json', 'utf8'))[0].filename")"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::npm pack did not produce the expected package archive."
            exit 1
          fi

          node --input-type=module - "$RUNNER_TEMP/flisk-import-pack.json" <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0];
          if (report.name !== 'flisk-import') {
            throw new Error(`Unexpected package name: ${report.name}`);
          }
          const files = new Set(report.files.map(({ path }) => path));
          for (const required of ['package.json', 'README.md', 'dist/cli.js']) {
            if (!files.has(required)) throw new Error(`Package is missing required file: ${required}`);
          }
          for (const file of files) {
            if (file.startsWith('node_modules/') || file.includes('/node_modules/') || file.startsWith('.git/')) {
              throw new Error(`Package contains excluded content: ${file}`);
            }
          }
          console.log(`Validated ${report.filename} (${report.size} bytes)`);
          NODE

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Probe the npm OIDC token exchange (read only, publishes nothing)
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org"
          id_token="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).value")"
          echo "OIDC id_token length: ${#id_token}"
          for pkg in flisk-import '%40flisk-sh%2Fflisk-import'; do
            echo "=== exchange for ${pkg} ==="
            curl -sS -X POST -H "Authorization: Bearer ${id_token}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg}" \
              -w "\nHTTP %{http_code}\n"
          done

      - name: Retain package archive for release recovery
        if: always() && steps.package.outputs.tarball != ''
        uses: actions/upload-artifact@v4
        with:
          name: flisk-import-package-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30
