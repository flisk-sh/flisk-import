name: Publish flisk-import to npm

# flisk-import is published to npmjs.org from this repository with npm's trusted publishing
# (OIDC): no long-lived npm token lives in this repo, and the publish is attested with
# provenance that names this repository's workflow and source.
#
# The package is published under two names: the unscoped "flisk-import" and the scoped
# "@flisk-sh/flisk-import". A package has exactly one name in its package.json, so the
# second name is the same archive with the name rewritten in the packed manifest.
#
# Owner setup required before the first publish succeeds: npmjs.com -> Packages -> flisk-import
# -> Settings -> Trusted Publisher -> GitHub Actions -> organization "flisk-sh", repository
# "flisk-import", workflow filename "publish-npm.yml", allowed action "npm publish". The same
# configuration is needed for "@flisk-sh/flisk-import" once that package exists.
# A package's first version cannot be published through OIDC, so version 0.2.2 (or later) has
# to be published once with an npm token before the trusted publisher can take over.
# The first version is published with the NPM_TOKEN repository secret, because npm cannot
# publish a package that does not exist yet through OIDC. Once the trusted publisher is
# configured and has done its first publish, the secret can be removed again.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14; the pinned CLI also
      # supports managing dist-tags through OIDC.
      - name: Install a trusted-publishing-capable npm CLI
        run: npm install --global npm@12.2.0

      - name: Install and verify
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm run test

      - name: Build the CLI
        run: npm run build

      - name: Check release version and pack package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Release tag version '$tag_version' does not match package version '$package_version'."
            exit 1
          fi

          # The archive is packed with --ignore-scripts: the build already ran in the step above, and
          # the prepare script would otherwise print into the same stdout that carries npm's report.
          mkdir -p "$RUNNER_TEMP/flisk-import-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/flisk-import-package" --silent
          tarball="$(find "$RUNNER_TEMP/flisk-import-package" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [[ -z "$tarball" || ! -f "$tarball" ]]; then
            echo "::error::npm pack did not produce the expected package archive."
            exit 1
          fi

          # The archive itself is the source of truth for what gets published.
          node --input-type=module - "$tarball" "$package_version" <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tarball = process.argv[2];
          const listing = execFileSync('tar', ['-tzf', tarball], { encoding: 'utf8' })
            .split('\n')
            .filter(Boolean)
            .map((entry) => entry.replace(/^package\//, ''));
          const files = new Set(listing);
          for (const required of ['package.json', 'README.md', 'dist/cli.js']) {
            if (!files.has(required)) throw new Error(`Package is missing required file: ${required}`);
          }
          for (const file of files) {
            if (file.startsWith('node_modules/') || file.includes('/node_modules/') || file.startsWith('.git/')) {
              throw new Error(`Package contains excluded content: ${file}`);
            }
          }
          const manifest = JSON.parse(
            execFileSync('tar', ['-xzOf', tarball, 'package/package.json'], { encoding: 'utf8' }),
          );
          if (manifest.name !== 'flisk-import') {
            throw new Error(`Unexpected package name: ${manifest.name}`);
          }
          if (manifest.version !== process.argv[3]) {
            throw new Error(`Unexpected package version: ${manifest.version}`);
          }
          console.log(`Validated ${tarball} (${listing.length} files, version ${manifest.version})`);
          NODE

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          # A token is only needed for a package's first version: npm cannot publish a
          # package that does not exist yet through OIDC. Once the trusted publisher is
          # configured, this secret is not needed any more.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with the NPM_TOKEN secret."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret: publishing with npm trusted publishing (OIDC)."
          fi
          if npm view "flisk-import@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "flisk-import@$PACKAGE_VERSION is already published to npm, skipping."
            exit 0
          fi
          # No NODE_AUTH_TOKEN: npm exchanges this workflow's OIDC identity for a short-lived
          # publish token, and attaches a provenance attestation for the public package.
          set +e
          npm publish "$PACKAGE_TARBALL" --access public --provenance 2>&1 | tee "$RUNNER_TEMP/publish.log"
          publish_status=${PIPESTATUS[0]}
          set -e
          # npm reads the package back after the upload to attach the provenance attestation, and the
          # registry can still 404 that read while the new version propagates. The version becoming
          # visible is the source of truth, so wait for it before calling the publish a failure.
          for _ in $(seq 1 30); do
            if npm view "flisk-import@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "flisk-import@$PACKAGE_VERSION is on the registry."
              exit 0
            fi
            sleep 10
          done
          if [ "$publish_status" -ne 0 ]; then
            echo "::error::npm publication failed for version $PACKAGE_VERSION."
            if grep -qi "trusted publisher" "$RUNNER_TEMP/publish.log"; then
              echo "::error::npm has no trusted publisher for flisk-import pointing at flisk-sh/flisk-import and workflow publish-npm.yml. Configure it on npmjs.com, then rerun this workflow."
            fi
            exit 1
          fi
          echo "::error::flisk-import@$PACKAGE_VERSION was published but did not become visible within 5 minutes."
          exit 1

      # The same archive under the organization scope. The scoped name is a second publication of
      # the same bytes, not a second build.
      - name: Build the scoped archive
        id: scoped
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/scoped-package"
          mkdir -p "$work_dir"
          tar -xzf "$PACKAGE_TARBALL" -C "$work_dir"
          node --input-type=module - "$work_dir/package/package.json" <<'NODE'
          import fs from 'node:fs';
          const manifestPath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.name !== 'flisk-import') {
            throw new Error(`Unexpected package name: ${manifest.name}`);
          }
          // Only the name changes: the bin entries, the version and the contents stay the ones the
          // unscoped package was published with.
          manifest.name = '@flisk-sh/flisk-import';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          # --ignore-scripts: the archive already carries the built CLI, and the build script is
          # not part of the published files.
          scoped_tarball="$(cd "$work_dir/package" && npm pack --ignore-scripts --pack-destination "$work_dir" --silent)"
          if [[ ! -f "$work_dir/$scoped_tarball" ]]; then
            echo "::error::npm pack did not produce the scoped archive."
            exit 1
          fi
          echo "tarball=$work_dir/$scoped_tarball" >> "$GITHUB_OUTPUT"

      - name: Publish the scoped package to npm
        env:
          PACKAGE_TARBALL: ${{ steps.scoped.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          # A token is only needed for a package's first version: npm cannot publish a
          # package that does not exist yet through OIDC. Once the trusted publisher is
          # configured, this secret is not needed any more.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with the NPM_TOKEN secret."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret: publishing with npm trusted publishing (OIDC)."
          fi
          if npm view "@flisk-sh/flisk-import@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@flisk-sh/flisk-import@$PACKAGE_VERSION is already published to npm, skipping."
            exit 0
          fi
          set +e
          npm publish "$PACKAGE_TARBALL" --access public --provenance 2>&1 | tee "$RUNNER_TEMP/publish-scoped.log"
          publish_status=${PIPESTATUS[0]}
          set -e
          # The registry can still 404 the read-back npm does after the upload, while the new
          # version propagates. The version becoming visible is the source of truth.
          for _ in $(seq 1 30); do
            if npm view "@flisk-sh/flisk-import@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "@flisk-sh/flisk-import@$PACKAGE_VERSION is on the registry."
              exit 0
            fi
            sleep 10
          done
          if [ "$publish_status" -ne 0 ]; then
            echo "::error::npm publication failed for @flisk-sh/flisk-import version $PACKAGE_VERSION."
            if grep -qi "trusted publisher" "$RUNNER_TEMP/publish-scoped.log"; then
              echo "::error::npm has no trusted publisher for @flisk-sh/flisk-import pointing at flisk-sh/flisk-import and workflow publish-npm.yml. Configure it on npmjs.com, then rerun this workflow."
            fi
            exit 1
          fi
          echo "::error::@flisk-sh/flisk-import@$PACKAGE_VERSION was published but did not become visible within 5 minutes."
          exit 1

      - name: Retain package archive for release recovery
        if: always() && steps.package.outputs.tarball != ''
        uses: actions/upload-artifact@v4
        with:
          name: flisk-import-package-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30
